name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Unsigned builds. The Mac build is ad-hoc signed ("-") so it runs on Apple Silicon;
      # add real signing secrets (CSC_LINK, APPLE_ID, ...) later for a smooth install.
      - run: npx electron-builder ${{ matrix.target }} --publish never -c.mac.identity=-
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: MumbleWrite-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
