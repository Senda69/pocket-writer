name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write # to publish installers on the Releases page

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Unsigned builds. The Mac build is ad-hoc signed ("-") so it runs on Apple Silicon;
      # add real signing secrets (CSC_LINK, APPLE_ID, ...) later for a smooth install.
      - run: npx electron-builder ${{ matrix.target }} --publish never -c.mac.identity=-
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: PocketWriter-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
      - name: Read version
        id: version
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Puts the installers on the repo's Releases page for easy downloading.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.v }}
          name: Pocket Writer ${{ steps.version.outputs.v }}
          body: |
            **Windows:** download `Pocket Writer Setup ${{ steps.version.outputs.v }}.exe` and double-click it. If Windows shows "Windows protected your PC", click **More info**, then **Run anyway**.
            **Mac:** download the `.dmg` (arm64 for Apple Silicon, x64 for Intel). The first time, right-click the app and choose **Open**.
          files: |
            dist/*.dmg
            dist/*.exe
